<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="only light">

<title>Mar Alderete · Mentora en Prosperidad Consciente</title>
<meta name="description" content="Fundadora de Arquitectura del Ser®. Agendá tu sesión de claridad con Mar Alderete.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:only light;
    --crema:#F7F1E8;
    --beige:#EADFCC;
    --arena:#D9C6A5;
    --dorado:#B8924A;
    --dorado-claro:#D4B373;
    --tierra:#7A5A3A;
    --tierra-oscuro:#4A3524;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Mulish',sans-serif;
    color:var(--tierra-oscuro);
    background:radial-gradient(ellipse at top,#FBF7F0 0%,var(--crema) 45%,var(--beige) 100%);
    min-height:100vh;
    display:flex;justify-content:center;
    padding:48px 20px 40px;
  }
  .wrap{width:100%;max-width:440px;text-align:center}
  .foto{
    width:132px;height:132px;margin:0 auto 22px;border-radius:50%;
    padding:4px;background:linear-gradient(135deg,var(--dorado-claro),var(--dorado),var(--tierra));
    box-shadow:0 10px 30px rgba(122,90,58,.18);
    animation:aparecer .8s ease both;
  }
  .foto-inner{
    width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--crema);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond',serif;font-size:56px;color:var(--dorado);
  }
  .foto-inner img{width:100%;height:100%;object-fit:cover}
  .logo{
    width:230px;height:230px;margin:0 auto 18px;border-radius:50%;overflow:hidden;
    box-shadow:0 12px 34px rgba(122,90,58,.22);animation:aparecer .8s ease both;
  }
  .logo img{width:100%;height:100%;object-fit:cover;display:block;transform:none}
  h1{
    font-family:'Cormorant Garamond',serif;font-weight:600;font-size:38px;line-height:1.1;
    color:var(--tierra-oscuro);animation:aparecer .8s .1s ease both;
  }
  .titulo{
    margin-top:8px;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
    font-size:19px;letter-spacing:.02em;color:var(--dorado);
    animation:aparecer .8s .2s ease both;
  }
  .fundadora{
    font-family:'Cormorant Garamond',serif;font-weight:600;font-size:23px;line-height:1.2;
    color:var(--tierra-oscuro);animation:aparecer .8s .15s ease both;
  }
  .separador{
    display:flex;align-items:center;gap:12px;justify-content:center;margin:26px 0 22px;
    color:var(--dorado);font-size:18px;animation:aparecer .8s .25s ease both;
  }
  .separador::before,.separador::after{content:"";height:1px;width:60px;background:linear-gradient(90deg,transparent,var(--dorado-claro),transparent)}
  .frase{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;line-height:1.35;
    color:var(--tierra);margin-bottom:30px;animation:aparecer .8s .3s ease both;
  }
  .invitacion{
    font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
    color:var(--dorado);margin-bottom:14px;animation:aparecer .8s .33s ease both;
  }
  .botones{display:flex;flex-direction:column;align-items:center;gap:12px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;max-width:330px;padding:14px 18px;border-radius:999px;text-decoration:none;
    font-weight:700;font-size:15px;transition:transform .2s,box-shadow .2s;
    animation:aparecer .8s ease both;
  }
  .btn:hover,.btn:active{transform:translateY(-2px)}
  .btn-principal{
    background:linear-gradient(135deg,var(--dorado-claro),var(--dorado));
    color:#fff;box-shadow:0 10px 24px rgba(184,146,74,.35);
    animation-delay:.35s;
  }
  .btn-principal small{display:block;font-weight:400;font-size:12.5px;opacity:.92;margin-top:2px}
  .btn-secundario{
    background:rgba(255,255,255,.6);color:var(--tierra-oscuro);
    border:1.5px solid var(--arena);
  }
  .btn-secundario:nth-child(2){animation-delay:.42s}
  
  .fila-wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:330px}
  .fila-wa .btn{max-width:none;flex:1;white-space:nowrap;padding:14px 12px}
  .wa-icono{
    width:50px;height:50px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:#fff;color:var(--dorado);border:1.5px solid var(--dorado-claro);
    box-shadow:0 6px 16px rgba(184,146,74,.25);animation:aparecer .8s .35s ease both;
  }
  .wa-icono svg{width:26px;height:26px}
  .btn svg{width:22px;height:22px;flex-shrink:0}
  footer{
    margin-top:38px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--tierra);opacity:.75;
  }
  @keyframes aparecer{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
